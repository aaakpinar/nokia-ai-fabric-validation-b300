      \"all\",\r\n\"enable-ecn\": true,\r\n\"min-threshold-percent\": 30,\r\n\"max-threshold-percent\":
      85,\r\n\"slope-enabled\": true,\r\n\"max-drop-probability-percent\": 100\r\n}
