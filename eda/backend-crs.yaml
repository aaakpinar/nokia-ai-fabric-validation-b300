apiVersion: core.eda.nokia.com/v1
kind: IndexAllocationPool
metadata:
  labels:
    eda.nokia.com/bootstrap: 'true'
  name: leafindex-pool
  namespace: ai-fabric-be
spec:
  publishAllocations: true
  segments:
    - allocations:
        - name: 2tier-beleaf-01
          value: 1
        - name: 2tier-beleaf-02
          value: 2
      reservations: []
      size: 10
      start: 1
--- 
apiVersion: core.eda.nokia.com/v1
kind: IPAllocationPool
metadata:
  name: system0-leaf
  namespace: ai-fabric-be
spec:
  segments:
    - allocations:
        - name: stripe01-leaf-2tier-beleaf-01
          value: 192.168.1.1
        - name: stripe01-leaf-2tier-beleaf-02
          value: 192.168.1.2
      reservations: []
      subnet: 192.168.1.0/24
--- 
apiVersion: core.eda.nokia.com/v1
kind: IPAllocationPool
metadata:
  name: system0-spine
  namespace: ai-fabric-be
spec:
  segments:
    - allocations:
        - name: stripeconn01-spine-2tier-bespine-01
          value: 192.168.2.1
      reservations: []
      subnet: 192.168.2.0/24
--- 
apiVersion: aifabrics.eda.nokia.com/v1alpha1
kind: Backend
metadata:
  name: ai-backend-fabric
  namespace: ai-fabric-be
spec:
  asnPool: asn-pool
  gpuIsolationGroups:
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster1
      name: islgrp1
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster2
      name: islgrp2
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster3
      name: islgrp3
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster4
      name: islgrp4
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster5
      name: islgrp5
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster6
      name: islgrp6
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster7
      name: islgrp7
    - interfaceSelector:
        - eda.nokia.com/tenant=gpucluster8
      name: islgrp8
  rocev2QoS:
    ecnMaxDropProbabilityPercent: 100
    ecnSlopeMaxThresholdPercent: 80
    ecnSlopeMinThresholdPercent: 30
    pfcDeadlockDetectionTimer: 750
    pfcDeadlockRecoveryTimer: 750
    queueMaximumBurstSize: 52110640
  stripeConnector:
    asnPool: asn-pool-spine
    linkSelector:
      - eda.nokia.com/role=interSwitchBE
    name: stripeconn01
    nodeSelector:
      - eda.nokia.com/stripeconn-id=stripeconn01
    systemPoolIPV4: system0-spine
  stripes:
    - asnPool: asn-pool-leaf
      gpuVlan: 1
      name: stripe01
      nodeSelector:
        - eda.nokia.com/stripe-id=stripe1
      stripeID: 1
      systemPoolIPV4: system0-leaf
--- 
